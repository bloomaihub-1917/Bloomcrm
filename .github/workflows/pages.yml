# 화면(GitHub Pages) 배포 — master에 푸시하면 올린다
#
# 왜 직접 올리나: GitHub Pages는 파일마다 10분 캐시(max-age=600)를 건다. 그래서 배포한 뒤에도
# 브라우저가 옛 js를 계속 써서 «고쳤는데 그대로»가 반복됐다. 올리기 전에 사본에서만
# 화면 파일 주소 끝에 커밋 번호(?v=abc1234)를 붙인다. 커밋이 바뀌면 주소가 바뀌니 새로 받는다.
# 저장소의 원본 코드는 건드리지 않는다.
#
# 이 방식을 쓰려면 저장소 Settings → Pages → Source가 «GitHub Actions»여야 한다.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 화면 파일 주소에 커밋 번호 붙이기
        run: |
          V=$(git rev-parse --short=7 HEAD)
          node - "$V" <<'EOF'
          const fs = require('fs'), path = require('path');
          const v = process.argv[2];
          // js 안의 상대 경로 import('./x.js', '../x.js') — 정적·동적 둘 다
          const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) =>
            e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
          let n = 0;
          for (const f of walk('js').filter((f) => f.endsWith('.js'))) {
            const s = fs.readFileSync(f, 'utf8');
            const t = s.replace(/(['"])(\.{1,2}\/[^'"\s]+?\.js)\1/g, (m, q, p) => (n++, `${q}${p}?v=${v}${q}`));
            if (t !== s) fs.writeFileSync(f, t);
          }
          // index.html의 진입 스크립트와 스타일
          const h = fs.readFileSync('index.html', 'utf8')
            .replace(/(src|href)="((?:js|styles)\/[^"?]+\.(?:js|css))"/g, (m, a, p) => (n++, `${a}="${p}?v=${v}"`));
          fs.writeFileSync('index.html', h);
          console.log(`주소 ${n}곳에 ?v=${v}`);
          // 끊겨도 앱이 열리게(sw.js) — 화면 파일 전부의 목록. 서비스 워커는 이 파일 내용이 바뀌어야 새로 깔리니 끝에 커밋 번호를 적는다
          //   js는 위에서 모두 ?v=<커밋>이 붙었다. css는 index.html에 적힌 주소 그대로(이미 ?v=날짜가 붙은 것은 그대로 둔다)
          const css = [...h.matchAll(/href="(styles\/[^"]+\.css[^"]*)"/g)].map((m) => m[1]);
          const files = ['./', ...walk('js').filter((f) => f.endsWith('.js')).map((f) => f.split(path.sep).join('/') + '?v=' + v), ...css];
          fs.writeFileSync('precache.json', JSON.stringify(files));
          fs.appendFileSync('sw.js', '\n// 배포 ' + v + '\n');
          console.log(`미리 받아 둘 화면 파일 ${files.length}개`);
          EOF
          rm -rf .github

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
